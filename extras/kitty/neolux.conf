# Neolux colorscheme for Kitty
# Usage:
# Place in ~/.config/kitty/themes/neolux.conf
# And include in your ~/.config/kitty/kitty.conf:
#   include themes/neolux.conf

# Basic Colors
foreground              #ffffff
background              #000000
selection_foreground    #000000
selection_background    #ffffff

# Cursor Colors
cursor                  #f98800
cursor_text_color       #000000

# URL underline
url_color               #55efef

# Window Borders
active_border_color     #f98800
inactive_border_color   #3c3c3a
bell_border_color       #c5003c

# Tab Bar
tab_bar_background      #000000
active_tab_foreground   #ffffff
active_tab_background   #000000
inactive_tab_foreground #57595b
inactive_tab_background #0c0c0c

# Normal ANSI Colors (0-7)
color0                  #0c0c0c
color1                  #c5003c
color2                  #2fff73
color3                  #ffcc00
color4                  #044b8b
color5                  #723ec3
color6                  #55efef
color7                  #ffffff

# Bright ANSI Colors (8-15)
color8                  #3c3c3a
color9                  #f84285
color10                 #5cd85a
color11                 #f3e600
color12                 #2495ff
color13                 #8b53fe
color14                 #88dddd
color15                 #f5f1e8
