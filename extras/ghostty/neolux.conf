# Neolux colorscheme for Ghostty
# Place in ~/.config/ghostty/themes/neolux.conf
# and set `theme = neolux` in your ~/.config/ghostty/config

# Base Colors
background = #000000
foreground = #ffffff
cursor-color = #f98800
cursor-text = #000000
selection-background = #ffffff
selection-foreground = #000000
split-divider-color = #57595b

# Standard ANSI Colors (0-7)
palette = 0=#0c0c0c
palette = 1=#c5003c
palette = 2=#2fff73
palette = 3=#ffcc00
palette = 4=#044b8b
palette = 5=#723ec3
palette = 6=#55efef
palette = 7=#ffffff

# Bright ANSI Colors (8-15)
palette = 8=#3c3c3a
palette = 9=#f84285
palette = 10=#5cd85a
palette = 11=#f3e600
palette = 12=#2495ff
palette = 13=#8b53fe
palette = 14=#88dddd
palette = 15=#f5f1e8
