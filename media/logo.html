<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEOLUX</title>
    <!-- Web font fallback for Adwaita Sans -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gjsify/adwaita-fonts/index.css">
    <style>
        /* Local Adwaita Mono font mapping */
        @font-face {
            font-family: 'Adwaita Mono';
            src: local('AdwaitaMono Nerd Font Bold'),
                 local('AdwaitaMono Nerd Font'),
                 local('AdwaitaMono Nerd Font Propo Bold'),
                 local('AdwaitaMono Nerd Font Propo'),
                 local('Adwaita Mono Bold'),
                 local('Adwaita Mono');
            font-weight: bold;
            font-style: normal;
        }

        body {
            background-color: #000000; /* bg */
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'AdwaitaMono Nerd Font', 'Adwaita Mono', 'Adwaita Sans', 'Adwaita', monospace;
            overflow: hidden;
        }

        .title {
            font-size: 10rem;
            font-weight: bold;
            letter-spacing: 0.05em;
            user-select: none;
        }

        /* Palette Colors */
        .c-light-blue { color: #00ffff; }
        .c-blue       { color: #044b8b; }
    </style>
</head>
<body>
    <div class="title">
        <span class="c-light-blue">N</span>
        <span class="c-light-blue">E</span>
        <span class="c-light-blue">O</span>
        <span class="c-blue">L</span>
        <span class="c-blue">U</span>
        <span class="c-blue">X</span>
    </div>
</body>
</html>
