# Neolux colorscheme for WezTerm
# Place in ~/.config/wezterm/colors/neolux.toml
# and set `config.color_scheme = "neolux"` in your wezterm.lua

[metadata]
name = "neolux"
author = "Murilo Barros"
origin_url = "https://github.com/murilodlb/neolux"

[colors]
foreground = "#ffffff"
background = "#000000"

cursor_bg = "#f98800"
cursor_fg = "#000000"
cursor_border = "#f98800"

selection_fg = "#000000"
selection_bg = "#ffffff"

scrollbar_thumb = "#57595B"
split = "#57595B"

ansi = [
    "#0c0c0c", # black   (gray1)
    "#D90000", # red
    "#01de82", # green   (green)
    "#ffcc00", # yellow  (yellow)
    "#363199", # blue    (navy)
    "#723EC3", # magenta (purple)
    "#00ffff", # cyan    (light_blue)
    "#ffffff", # white   (fg)
]

brights = [
    "#3c3c3a", # bright black   (gray2)
    "#e20372", # bright red     (pink)
    "#08CB00", # bright green   (green)
    "#e6db74", # bright yellow  (beige - distinct from standard yellow)
    "#2495ff", # bright blue    (blue)
    "#8b53fe", # bright magenta (purple)
    "#92EEFF", # bright cyan    (light_blue)
    "#ffffff", # bright white   (fg)
]

[colors.tab_bar]
background = "#000000"

[colors.tab_bar.active_tab]
bg_color = "#000000"
fg_color = "#ffffff"
intensity = "Bold"

[colors.tab_bar.inactive_tab]
bg_color = "#0c0c0c"
fg_color = "#57595B"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#3c3c3a"
fg_color = "#ffffff"

[colors.tab_bar.new_tab]
bg_color = "#0c0c0c"
fg_color = "#57595B"

[colors.tab_bar.new_tab_hover]
bg_color = "#f98800"
fg_color = "#000000"
intensity = "Bold"
